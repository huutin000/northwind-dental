# CI for Northwind Dental: lint, typecheck, unit tests, production build, mock-AI e2e tests.
#
# Action pins: every `uses:` is pinned by FULL COMMIT SHA with the release in a trailing comment. Tags are
# mutable, a SHA is not (supply-chain choice). To bump an action, re-resolve the SHA of the new release tag
# (for example `git ls-remote https://github.com/actions/checkout "refs/tags/vX.Y.Z*"`) and update the comment.
#
# Safety: no repository secrets are used, the privileged PR trigger is not used, and no event data is interpolated into
# `run:` scripts. The @live tests (real Groq) are never run here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    # Pinned runner image (not ubuntu-latest) so a runner image change cannot alter results silently.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AI_MODE: mock
      # No key-value variable is set on purpose: the e2e config blanks all four itself and the unit tests
      # strip them in tests/setup.ts, so CI can never reach a real Upstash database. CI=true is set by Actions.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          persist-credentials: false

      # Node 26 is the only version used: the project has no `engines` field and no .nvmrc, and every local
      # verification ran on Node 26.13.0. The owner may switch to 24 after deciding. `cache: npm` keys the npm
      # cache by package-lock.json.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (2026-10-08)
        with:
          node-version: 26
          cache: npm

      # A throw-away session secret generated on the runner. It is NOT a repository secret. The e2e webServer
      # config sets its own fake secret and the unit tests need none; this only makes the build/start
      # environment explicit.
      - name: Generate session secret
        run: |
          value="$(openssl rand -hex 32)"
          echo "::add-mask::${value}"
          echo "SESSION_SECRET=${value}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (2026-06-26)
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # System libraries are not cached, so they are installed on a cache hit too.
      - name: Install Chromium and system libraries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system libraries only (browser cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: End-to-end tests (mock AI)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (2026-10-07)
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
